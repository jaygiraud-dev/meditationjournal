<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; background: #0c0e1f; color: #ece6d8; font-family: 'Manrope', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #d9a84e; } a:hover { color: #f0c66a; }
    .serif { font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: radial-gradient(90% 50% at 50% 42%, rgba(217,168,78,0.28), rgba(217,168,78,0) 65%), radial-gradient(80% 40% at 50% 110%, rgba(141,132,230,0.22), rgba(141,132,230,0) 60%), #0c0e1f; overflow: hidden;">

  <!-- top bar -->
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 22px 20px 0;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <div style="width: 36px; height: 36px; border-radius: 18px; border: 1px solid rgba(217,168,78,0.5); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: #d9a84e;">J</div>
      <div style="font-size: 13px; color: #b9b5c9;">12-day streak · 5 this week · 3h 40</div>
    </div>
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #ece6d8;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V10"></path><path d="M10 19V5"></path><path d="M16 19v-8"></path><path d="M22 19H2"></path></svg>
    </div>
  </div>

  <!-- center dial -->
  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px;">
    <div style="position: relative; width: 260px; height: 260px;">
      <svg width="260" height="260" viewBox="0 0 260 260" style="position: absolute; left: 0; top: 0;">
        <circle cx="130" cy="130" r="120" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"></circle>
        <circle cx="130" cy="130" r="120" fill="none" stroke="#d9a84e" stroke-width="3" stroke-linecap="round" stroke-dasharray="754" stroke-dashoffset="754" transform="rotate(-90 130 130)"></circle>
        <circle cx="130" cy="130" r="98" fill="rgba(217,168,78,0.06)" stroke="rgba(217,168,78,0.25)" stroke-width="1"></circle>
      </svg>
      <div style="position: absolute; left: 0; top: 0; width: 260px; height: 260px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;">
        <div style="width: 84px; height: 84px; border-radius: 42px; background: #d9a84e; box-shadow: 0 0 60px rgba(217,168,78,0.5); display: flex; align-items: center; justify-content: center; color: #0c0e1f;">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>
        </div>
        <div class="serif" style="font-size: 26px; font-weight: 500; color: #f3eddf; line-height: 1;">62:00</div>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
      <div class="serif" style="font-size: 28px; font-weight: 600; line-height: 1.1; color: #f3eddf;">Morning Meditation</div>
      <div style="height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.14); display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: #b9b5c9;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"></path></svg>
        <span>Change track</span>
      </div>
    </div>
  </div>

  <!-- peeking rehearsal sheet -->
  <div style="border-radius: 28px 28px 0 0; padding: 12px 20px 30px; background: rgba(23,26,51,0.96); border: 1px solid rgba(255,255,255,0.10); border-bottom: none; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 -20px 60px rgba(12,14,31,0.8);">
    <div style="width: 40px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.22); align-self: center;"></div>
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <div class="serif" style="font-size: 22px; font-weight: 600; color: #f3eddf;">Rehearse</div>
        <div style="font-size: 12px; color: #8f8ca3;">Pull up to read the whole script</div>
      </div>
      <div style="display: flex; gap: 8px;">
        <div style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.14); display: flex; align-items: center; justify-content: center; color: #ece6d8;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
        </div>
        <div style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid rgba(240,198,106,0.5); display: flex; align-items: center; justify-content: center; color: #f0c66a;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path><path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"></path></svg>
        </div>
      </div>
    </div>
    <div style="display: flex; gap: 8px; overflow: hidden;">
      <div style="height: 32px; padding: 0 12px; border-radius: 16px; background: rgba(217,168,78,0.16); color: #f0c66a; font-size: 12px; font-weight: 600; display: flex; align-items: center; white-space: nowrap;">Thoughts</div>
      <div style="height: 32px; padding: 0 12px; border-radius: 16px; background: rgba(255,255,255,0.06); color: #b9b5c9; font-size: 12px; font-weight: 600; display: flex; align-items: center; white-space: nowrap;">Habits</div>
      <div style="height: 32px; padding: 0 12px; border-radius: 16px; background: rgba(255,255,255,0.06); color: #b9b5c9; font-size: 12px; font-weight: 600; display: flex; align-items: center; white-space: nowrap;">Emotions</div>
      <div style="height: 32px; padding: 0 12px; border-radius: 16px; background: rgba(255,255,255,0.06); color: #b9b5c9; font-size: 12px; font-weight: 600; display: flex; align-items: center; white-space: nowrap;">Beliefs</div>
      <div style="height: 32px; padding: 0 12px; border-radius: 16px; background: rgba(255,255,255,0.06); color: #b9b5c9; font-size: 12px; font-weight: 600; display: flex; align-items: center; white-space: nowrap;">Feelings</div>
    </div>
    <div class="serif" style="font-size: 21px; font-style: italic; line-height: 1.4; color: #f3eddf;">“I can heal fully. I can become wealthy. I can.”</div>
  </div>
</div>
</x-dc>
</body>
</html>
