<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; background: #0c0e1f; color: #ece6d8; font-family: 'Manrope', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #d9a84e; } a:hover { color: #f0c66a; }
    .serif { font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-end; background: radial-gradient(90% 50% at 50% 30%, rgba(217,168,78,0.12), rgba(217,168,78,0) 65%), #0c0e1f; overflow: hidden;">

  <!-- dimmed hint of the focus screen behind -->
  <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding-bottom: 40px; opacity: 0.35;">
    <div class="serif" style="font-size: 26px; font-weight: 500; color: #f3eddf;">62:00</div>
    <div style="font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: #8f8ca3;">Complete</div>
  </div>

  <!-- sheet -->
  <div style="border-radius: 28px 28px 0 0; padding: 12px 20px 34px; background: #171a33; border: 1px solid rgba(255,255,255,0.10); border-bottom: none; display: flex; flex-direction: column; gap: 22px; box-shadow: 0 -20px 60px rgba(12,14,31,0.9);">
    <div style="width: 40px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.22); align-self: center;"></div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center;">
      <div style="font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: #d9a84e;">Session complete</div>
      <div class="serif" style="font-size: 30px; font-weight: 500; line-height: 1.1; color: #f3eddf;">62 minutes. Day 13.</div>
      <div style="font-size: 13px; color: #8f8ca3;">How was it?</div>
    </div>

    <div style="display: flex; justify-content: center; gap: 6px;">
      <div style="width: 52px; height: 52px; display: flex; align-items: center; justify-content: center;"><svg width="36" height="36" viewBox="0 0 24 24" fill="#d9a84e"><path d="M12 2.5l2.9 6.2 6.8.8-5 4.7 1.3 6.8L12 17.7 5.9 21l1.3-6.8-5-4.7 6.8-.8z"></path></svg></div>
      <div style="width: 52px; height: 52px; display: flex; align-items: center; justify-content: center;"><svg width="36" height="36" viewBox="0 0 24 24" fill="#d9a84e"><path d="M12 2.5l2.9 6.2 6.8.8-5 4.7 1.3 6.8L12 17.7 5.9 21l1.3-6.8-5-4.7 6.8-.8z"></path></svg></div>
      <div style="width: 52px; height: 52px; display: flex; align-items: center; justify-content: center;"><svg width="36" height="36" viewBox="0 0 24 24" fill="#d9a84e"><path d="M12 2.5l2.9 6.2 6.8.8-5 4.7 1.3 6.8L12 17.7 5.9 21l1.3-6.8-5-4.7 6.8-.8z"></path></svg></div>
      <div style="width: 52px; height: 52px; display: flex; align-items: center; justify-content: center;"><svg width="36" height="36" viewBox="0 0 24 24" fill="#d9a84e"><path d="M12 2.5l2.9 6.2 6.8.8-5 4.7 1.3 6.8L12 17.7 5.9 21l1.3-6.8-5-4.7 6.8-.8z"></path></svg></div>
      <div style="width: 52px; height: 52px; display: flex; align-items: center; justify-content: center;"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#5a5870" stroke-width="1.5"><path d="M12 2.5l2.9 6.2 6.8.8-5 4.7 1.3 6.8L12 17.7 5.9 21l1.3-6.8-5-4.7 6.8-.8z"></path></svg></div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #8f8ca3; font-weight: 600;">Notes</div>
      <div style="min-height: 128px; border-radius: 18px; padding: 14px 16px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.10); font-size: 15px; line-height: 1.55; color: #ece6d8;">Dropped in fast. Held the feeling of gratitude for most of the second half.<span style="color: #d9a84e;">|</span></div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <div style="height: 32px; padding: 0 12px; border-radius: 16px; background: rgba(255,255,255,0.06); color: #b9b5c9; font-size: 12px; font-weight: 600; display: flex; align-items: center;">Settled quickly</div>
        <div style="height: 32px; padding: 0 12px; border-radius: 16px; background: rgba(255,255,255,0.06); color: #b9b5c9; font-size: 12px; font-weight: 600; display: flex; align-items: center;">Distracted</div>
        <div style="height: 32px; padding: 0 12px; border-radius: 16px; background: rgba(255,255,255,0.06); color: #b9b5c9; font-size: 12px; font-weight: 600; display: flex; align-items: center;">Felt elevated</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="height: 52px; border-radius: 26px; background: #d9a84e; color: #0c0e1f; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center;">Save to journal</div>
      <div style="height: 44px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: #8f8ca3;">Skip for now</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
